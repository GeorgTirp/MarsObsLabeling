name: Windows label persistence

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  save-export-recovery:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[gui,dev]"
      - name: Verify save, export, resume, failure preservation, and live rescue on Windows
        run: >-
          python -m pytest -q
          tests/test_atomic.py tests/test_windows_save_recovery.py
          tests/test_labeling_workflow.py tests/test_crop_export.py
          tests/test_mainwindow_label_recovery.py
