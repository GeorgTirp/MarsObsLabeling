paths:
  classes_file: classes.yaml
  labels_dir: ./labels
  predictions_dir: ./predictions  # mars-inference caches model predictions here (per model_id subfolder)

geometry:
  panel_size: 4096
  block_size: 512

navigation:
  advance_mode: next_unlabeled  # next_unlabeled | next_sequential
  advance_on_edit: false

display:
  max_canvas_px: 1600
  stretch_percentiles: [1, 99]

skip:
  nodata_skip_threshold: 0.5
  variance_skip_threshold: 0.0
  skip_low_variance: false

autosave:
  every_n_labels: 25
  every_seconds: 30

export:
  full_res: false

labeler: null  # null -> OS username

# mars-inference only (ignored by mars-label)
inference:
  ai4exomars_path: null  # null -> auto-detect sibling ../AI4ExoMars checkout, or installed package
  device: auto            # auto | cpu | cuda | mps
  batch_size: 4
  context_multiplier: 4   # context crop size = context_multiplier * local window size (context-branch models only)
  nodata_skip_threshold: 0.33  # blocks more nodata than this never reach the model; retired as nodata instead
